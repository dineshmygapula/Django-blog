{% extends 'base.html'%}
{% block content %}
  <h3 class="text-uppercase text-warning" style="letter-spacing: 2px;">Search term-{{keyword}}</h3>

  <div class="row mb-2">
    {% if blog %}
   {% for i in blog %}
    <div class="col-md-6">
      <div class="card border-0" >
        <div class="card-body">
          <h3><a href="{% url 'blog' i.slug%}" class="text-dark text-decoration-none">{{i.title}}</a> </h3>
          <small class="mb-1 text-muted">{{i.created_at | timesince}} ago by {{i.author}}</small>
          <p class="card-text">{{i.short_description}}</p>
        </div>
      </div>

    </div>
    {% endfor %}
    {% else %}
    <h3>blog not found </h3>
    {% endif %}

  </div>
{% endblock%}
