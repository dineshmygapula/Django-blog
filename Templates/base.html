<!--header part-->
{% load  static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{% static 'css\blog.css' %}">
</head>
<body>
   <div class="container">
     <header class="blog-header py-3">
        <div class="row flex-nowrap justify-content-between align-items-center">
         <div class="col-8" > 
            <a class="blog-header-log text-dark"   href="/">Django blog</a>
         </div>
          <div class="col-4 justify-content-end align-items-center">
           <a class="btn btn-sm btn-warning" href="">login</a> &nbsp;
            <a class="btn btn-sm btn-outline-secondary" href="">Register</a></div>
        </div>
     </header>
     <hr>
      <div class="nav-scroller py-2 mb-3" > 
        <nav class="nav d-flex justify-content-between">
        {% for cat in categories %}
          <a class="p-2 text-muted" href="{% url 'posts_by_category' cat.id%}">{{cat.Category_name}}</a>
        {% endfor %}
        </nav>
      </div>


<!--main content part-->
  {% block content %}
  {% endblock %}
<!--fotter part-->
<footer class="blog-footer">
  <p>Django blog built with � by <a href="#">Dinesh Brahmaji</a></p>
</footer>
</body>
</html>
